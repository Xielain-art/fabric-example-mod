plugins {
	id 'fabric-loom' version '1.6-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()

	maven {
		name = "EngineHub"
		url = "https://maven.enginehub.org/repo/"
	}

	maven {
		name = "WispForest"
		url = "https://maven.wispforest.io/releases/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"gerbarium_regions_bridge" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// WorldEdit API. Сам WorldEdit уже стоит отдельным модом на сервере/клиенте как мод.
	modCompileOnly "com.sk89q.worldedit:worldedit-fabric-mc1.20:7.2.15"

	// GUI / client-server helper lib
	modImplementation "io.wispforest:owo-lib:0.11.2+1.20"

	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "com.google.code.gson:gson:2.10.1"
}

tasks.test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

build.doLast {
	def src = remapJar.archiveFile.get().asFile
	def destDir = project == rootProject ? file('..') : rootProject.file('.')
	def dest = new File(destDir, "${project.archives_base_name}-${project.version}.jar")
	java.nio.file.Files.copy(src.toPath(), dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
}
